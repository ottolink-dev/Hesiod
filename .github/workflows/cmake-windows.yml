name: Windows Build and Package

on:
  schedule:
    # Runs every day at 02:00 UTC
    - cron: '0 2 * * *'
  push:
    branches: [ "main", "dev" ]
    paths-ignore:
      - "mkdocs.yml"
      - ".readthedocs.yaml"
      - "docs/**"
  pull_request:
    branches: [ "main", "dev" ]
    paths-ignore:
      - "mkdocs.yml"
      - ".readthedocs.yaml"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Package (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          arch: "win64_msvc2022_64"
          modules: "qtwebengine qtpositioning qtwebchannel"

      - name: Restore / Setup vcpkg Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_INSTALLATION_ROOT }}/installed
            ~/.cache/vcpkg/archives
          key: vcpkg-windows-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-windows-

      - name: Install vcpkg Dependencies
        run: |
          vcpkg install --triplet x64-windows spdlog nlohmann-json zlib gsl assimp glm opencv4 opencl glfw3

      - name: Configure CMake
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DHESIOD_ENABLE_GENERATE_APP_IMAGE=OFF `
            -DHIGHMAP_ENABLE_DOCS=OFF `
            -DHIGHMAP_ENABLE_EXAMPLES=OFF `
            -DHIGHMAP_ENABLE_TESTS=OFF `
            -DHIGHMAP_ENABLE_BENCHMARKS=OFF `
            -DGNODE_ENABLE_DOCS=OFF `
            -DGNODE_ENABLE_EXAMPLES=OFF `
            -DGNODE_ENABLE_TESTS=OFF `
            -DGNODEGUI_ENABLE_TESTS=OFF `
            -DMETA_ENABLE_TESTS=OFF `
            -S .

      - name: Build
        run: |
          cmake --build build --config Release --parallel 8

      - name: Prepare Self-Contained Package
        shell: pwsh
        run: |
          $packageDir = "hesiod-windows-x64"
          New-Item -ItemType Directory -Force -Path $packageDir

          # Find and copy hesiod.exe
          $exe = Get-ChildItem -Path build -Filter "hesiod.exe" -Recurse | Select-Object -First 1
          if (-not $exe) {
            Write-Error "hesiod.exe not found in build directory!"
            exit 1
          }
          Write-Host "Found executable at: $($exe.FullName)"
          Copy-Item -Path $exe.FullName -Destination $packageDir

          # Copy data assets
          Copy-Item -Path "Hesiod/data" -Destination "$packageDir/data" -Recurse -Force

          # Deploy Qt dependencies using windeployqt
          Write-Host "Running windeployqt..."
          windeployqt --release --compiler-runtime --dir "$packageDir" "$packageDir/hesiod.exe"

          # Copy third-party runtime DLLs from vcpkg
          $vcpkgBinDir = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          if (Test-Path $vcpkgBinDir) {
            Write-Host "Copying vcpkg DLLs from $vcpkgBinDir..."
            Get-ChildItem -Path $vcpkgBinDir -Filter "*.dll" | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination $packageDir -Force
            }
          }

          # Compress into a self-contained zip file
          Compress-Archive -Path "$packageDir\*" -DestinationPath "hesiod-windows-x64.zip" -Force
          Write-Host "Created hesiod-windows-x64.zip successfully."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hesiod-Windows-x64
          path: hesiod-windows-x64.zip

      - name: Publish Nightly Release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Hesiod Nightly Build"
          body: "Automated nightly build for Windows (x64)."
          prerelease: true
          make_latest: false
          files: hesiod-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
